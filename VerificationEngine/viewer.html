<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحقق من الشكاوى — نموذج أولي</title>
<style>
:root {
  --bg: #f4f5f7; --surface: #ffffff; --ink: #1c2430; --muted: #5b6676; --line: #e1e5eb; --soft: #f7f8fa;
  --brand: #1f3a5f; --brand-soft: #e8eef6;
  --st-insufficient: #6b7280; --st-insufficient-bg: #f1f2f4;
  --st-context: #8a5a00; --st-context-bg: #fdf3e1;
  --st-supported: #166534; --st-supported-bg: #e7f5ec;
  --st-inconsistent: #5b3c8f; --st-inconsistent-bg: #efe9f8;
  --st-conflicting: #a3410f; --st-conflicting-bg: #fbeadf;
  --safety-prompt: #b42318; --safety-prompt-bg: #fdecea;
  --safety-elevated: #9a5b00; --safety-elevated-bg: #fff4e0;
  --warn-bg: #fff7e6; --warn-line: #f0c36d;
  --radius: 10px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Segoe UI", Tahoma, "Noto Sans Arabic", Arial, sans-serif; font-size: 14px; line-height: 1.6; }
code, .mono { font-family: Consolas, "Courier New", monospace; font-size: 12.5px; overflow-wrap: anywhere; }
bdi { unicode-bidi: isolate; }
header.topbar { background: var(--brand); color: #fff; padding: 14px 24px; display: flex; align-items: center;
  justify-content: space-between; gap: 12px; flex-wrap: wrap; }
header h1 { margin: 0; font-size: 19px; font-weight: 600; }
header .sub { font-size: 12.5px; opacity: .85; }
.modes { display: flex; gap: 6px; background: rgba(255,255,255,.12); padding: 4px; border-radius: 8px; flex-wrap: wrap; }
.modes button { border: 0; background: transparent; color: #fff; padding: 7px 14px; border-radius: 6px; cursor: pointer; font: inherit; }
.modes button.active { background: #fff; color: var(--brand); font-weight: 600; }
.banner { padding: 9px 24px; font-size: 13px; font-weight: 600; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
.banner.mode-a { background: #eef2f7; color: var(--brand); }
.banner.mode-b { background: #fff1e6; color: #8a3b00; }
.layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px; padding: 18px 24px 40px; max-width: 1500px; margin: 0 auto; }
aside.sidebar { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px;
  align-self: start; position: sticky; top: 12px; max-height: calc(100vh - 24px); display: flex; flex-direction: column; min-width: 0; }
.picker-toggle { display: none; width: 100%; border: 1px solid var(--brand); background: var(--brand-soft); color: var(--brand);
  border-radius: 8px; padding: 8px; font: inherit; font-weight: 600; cursor: pointer; margin-top: 8px; }
.picker-body { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.sidebar input, .sidebar select { width: 100%; padding: 7px 9px; border: 1px solid var(--line); border-radius: 7px; font: inherit; background: #fff; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.filters label { font-size: 11.5px; color: var(--muted); display: block; margin-bottom: 2px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; margin-top: 10px; }
.seg button { flex: 1; border: 0; background: #fff; padding: 6px; cursor: pointer; font: inherit; font-size: 12.5px; }
.seg button.active { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.countrow { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 8px; }
.count { font-size: 12px; color: var(--muted); }
.linkbtn { border: 0; background: none; color: var(--brand); cursor: pointer; font: inherit; font-size: 12px; text-decoration: underline; padding: 0; }
.list { overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 6px; padding-left: 2px; min-height: 120px; }
.item { text-align: right; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 10px; cursor: pointer; font: inherit; min-width: 0; }
.item:hover { border-color: #b9c4d3; }
.item.selected { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand-soft); }
.item .row1 { display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; }
.item .id { font-weight: 600; }
.item .txt { color: var(--muted); font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
main { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; min-width: 0; }
.card h2 { margin: 0 0 10px; font-size: 15px; color: var(--brand); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card h3 { margin: 12px 0 6px; font-size: 13.5px; }
details.card > summary { cursor: pointer; list-style: none; }
details.card > summary h2 { margin: 0; }
details.card > summary::before { content: "▸"; color: var(--brand); float: right; margin-left: 8px; }
details.card[open] > summary::before { content: "▾"; }
details.card[open] > summary { margin-bottom: 10px; }
.summary-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px; background: var(--soft); min-width: 0; }
.tile .label { font-size: 11.5px; color: var(--muted); margin-bottom: 4px; }
.tile .big { font-size: 15px; font-weight: 600; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.kv { display: grid; grid-template-columns: minmax(80px, max-content) minmax(0, 1fr); gap: 4px 14px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.complaint-text { background: var(--soft); border-right: 3px solid var(--brand); padding: 10px 12px; border-radius: 6px; font-size: 15px; margin: 10px 0; overflow-wrap: anywhere; }
.chip { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; max-width: 100%; }
.chip.small { font-size: 11px; padding: 1px 7px; font-weight: 500; }
.st-INSUFFICIENT_EVIDENCE { color: var(--st-insufficient); background: var(--st-insufficient-bg); }
.st-CONTEXT_ONLY { color: var(--st-context); background: var(--st-context-bg); }
.st-INDEPENDENTLY_SUPPORTED { color: var(--st-supported); background: var(--st-supported-bg); }
.st-INCONSISTENT_WITH_RELIABLE_MEASUREMENT { color: var(--st-inconsistent); background: var(--st-inconsistent-bg); }
.st-CONFLICTING_EVIDENCE { color: var(--st-conflicting); background: var(--st-conflicting-bg); }
.st-NONE, .st-null { color: var(--muted); background: var(--soft); }
.sf-PROMPT_SAFETY_REVIEW { color: var(--safety-prompt); background: var(--safety-prompt-bg); }
.sf-ELEVATED_HUMAN_REVIEW { color: var(--safety-elevated); background: var(--safety-elevated-bg); }
.sf-NONE { color: var(--muted); background: var(--soft); }
.neutral { color: var(--muted); background: var(--soft); }
.status-big { font-size: 17px; padding: 6px 14px; }
.lead { font-size: 14.5px; margin: 10px 0 4px; }
.note { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.warn { background: var(--warn-bg); border: 1px solid var(--warn-line); border-radius: 7px; padding: 7px 10px; font-size: 12.5px; margin: 6px 0; overflow-wrap: anywhere; }
.danger { background: var(--safety-prompt-bg); border: 1px solid #f3b4ad; border-radius: 7px; padding: 8px 10px; font-size: 13px; overflow-wrap: anywhere; }
.notauth { background: #eef2f7; border: 1px dashed #9fb0c8; border-radius: 7px; padding: 7px 10px; font-size: 12.5px; margin-top: 10px; }
ul.plain { margin: 6px 0; padding-right: 18px; }
ul.plain li { margin: 2px 0; }
.interp-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.interp-tabs button { border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 5px 10px; cursor: pointer; font: inherit; font-size: 12.5px; }
.interp-tabs button.active { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 8px 12px; cursor: pointer; font: inherit; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button.active { color: var(--brand); border-bottom-color: var(--brand); font-weight: 600; }
.tabs .n { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--soft); font-size: 11px; margin-right: 4px; }
.ev { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; min-width: 0; }
.ev.dup { opacity: .78; }
.ev .head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
.ev .title { font-weight: 600; overflow-wrap: anywhere; }
.ev .meta { display: grid; grid-template-columns: minmax(80px, max-content) minmax(0, 1fr); gap: 2px 12px; font-size: 12.5px; margin-top: 6px; }
.ev .meta dt { color: var(--muted); }
.ev .meta dd { margin: 0; overflow-wrap: anywhere; min-width: 0; }
.reasons { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.reasons span { background: var(--soft); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; font-size: 11.5px; overflow-wrap: anywhere; }
details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 4px; }
.empty { color: var(--muted); font-size: 13px; padding: 10px; background: var(--soft); border-radius: 7px; }
.timeline-wrap { overflow-x: auto; direction: ltr; max-width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 8px; direction: rtl; }
.legend i { display: inline-block; width: 18px; height: 8px; margin-left: 5px; vertical-align: middle; border-radius: 2px; }
fieldset.preview { border: 1px dashed #aab4c3; border-radius: 8px; padding: 12px; opacity: .75; min-width: 0; }
fieldset.preview label { display: block; font-size: 12.5px; color: var(--muted); margin: 6px 0 2px; }
fieldset.preview select, fieldset.preview input, fieldset.preview textarea { width: 100%; padding: 6px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: #f3f4f6; }
.preview-tag { display: inline-block; background: #374151; color: #fff; border-radius: 6px; padding: 2px 8px; font-size: 12px; }
.error { margin: 40px auto; max-width: 640px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
@media (max-width: 1200px) { .summary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 1050px) {
  .layout { grid-template-columns: minmax(0, 1fr); padding: 12px 12px 32px; gap: 12px; }
  header.topbar { padding: 12px 14px; }
  .banner { padding: 8px 14px; }
  aside.sidebar { position: static; max-height: none; }
  .picker-toggle { display: block; }
  aside.sidebar.collapsed .picker-body { display: none; }
  .list { max-height: 300px; }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .summary-grid, .filters { grid-template-columns: minmax(0, 1fr); }
  .card { padding: 12px; }
}
</style>
</head>
<body>
<header class="topbar">
  <div>
    <h1>التحقق من الشكاوى — Complaint Verification</h1>
    <div class="sub">نموذج أولي للعرض فقط (read-only) — تقييم بقواعد صريحة، مش موديل ML ومفيش نسبة ثقة</div>
  </div>
  <div class="modes" role="tablist" aria-label="Data mode">
    <button id="modeA" class="active" role="tab">البيانات التاريخية (Mode A)</button>
    <button id="modeB" role="tab">سيناريوهات تجريبية (Mode B)</button>
  </div>
</header>
<div id="banner" class="banner mode-a"></div>
<div class="layout" id="layout">
  <aside class="sidebar collapsed" id="sidebar">
    <input id="search" type="search" placeholder="بحث برقم الشكوى أو النص أو المنطقة" aria-label="Search">
    <button class="picker-toggle" id="pickerToggle" aria-expanded="false" aria-controls="pickerBody"></button>
    <div class="picker-body" id="pickerBody">
      <div id="timeSeg" class="seg">
        <button data-time="at_creation" class="active">وقت تقديم الشكوى</button>
        <button data-time="later_reassessment">بعد 24 ساعة</button>
      </div>
      <div class="filters" id="filters"></div>
      <div class="countrow"><span class="count" id="count"></span><button class="linkbtn" id="clearFilters">مسح البحث والفلاتر</button></div>
      <div class="list" id="list"></div>
    </div>
  </aside>
  <main id="main"></main>
</div>
<script src="viewer_logic.js"></script>
<script src="data/presentation_data.js"></script>
<script>
"use strict";
const DATA = window.CV_PRESENTATION_DATA;
const L = window.CVLogic;
const ZONE = (DATA && DATA.display_timezone) || "Africa/Cairo";
const state = { mode: "A", time: "at_creation", selected: null, interp: 0, tab: "contextual", filters: L.emptyFilters(), search: "" };

function el(tag, attrs, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") node.className = v;
    else if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
    else node.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return node;
}
const svgNS = "http://www.w3.org/2000/svg";
function s(tag, attrs, ...children) {
  const node = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) node.setAttribute(k, v);
  for (const c of children) node.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return node;
}
const fmt = new Intl.DateTimeFormat("en-GB", { timeZone: ZONE, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
function cairo(iso) {
  if (!iso) return "—";
  const p = Object.fromEntries(fmt.formatToParts(new Date(iso)).map(x => [x.type, x.value]));
  return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}`;
}
// Dates are isolated left-to-right so the RTL layout never reorders them.
function ltr(text) { return el("bdi", { dir: "ltr" }, text === null || text === undefined || text === "" ? "—" : text); }
function statusChip(code, label, big) {
  return el("span", { class: `chip st-${code || "NONE"}${big ? " status-big" : ""}` }, label || "مفيش حالة إجمالية");
}
function dash(v) { return v === null || v === undefined || v === "" ? "—" : v; }
const isNarrow = () => window.matchMedia("(max-width: 1050px)").matches;

// ------------------------------------------------------------------ records and selection
function records() { return !DATA ? [] : state.mode === "A" ? DATA.mode_a.records : DATA.mode_b.scenarios; }
const idOf = r => L.recordId(r, state.mode);
const assessmentOf = r => L.assessmentOf(r, state.mode, state.time);
function visible() { return L.filterRecords(records(), state.mode, state.time, state.filters, state.search); }

/* Single entry point after any change: the selection is re-resolved against the filtered list,
   so the details panel can never show a record the active filters exclude. */
function refresh(opts) {
  const items = visible();
  const before = state.selected;
  state.selected = L.resolveSelection(items.map(idOf), state.selected, state.mode === "A" ? DATA.default_complaint : null);
  if (state.selected !== before) { state.interp = 0; state.tab = defaultTab(); }
  if (!opts || opts.filters !== false) renderFilters();
  renderList(items);
  renderMain();
}

function options(values, labels) {
  return [el("option", { value: "" }, "الكل"), ...[...new Set(values)].filter(v => v !== undefined).sort()
    .map(v => el("option", { value: v }, labels && labels[v] ? labels[v] : (v === "null" ? "مفيش حالة" : v)))];
}
function renderFilters() {
  const box = document.getElementById("filters");
  box.replaceChildren();
  const all = records();
  const statusLabels = {}, actionLabels = {}, safetyLabels = {};
  all.forEach(r => { const a = assessmentOf(r); statusLabels[String(a.status)] = a.status_ar;
    if (a.recommendation) { actionLabels[a.recommendation.primary_action] = a.recommendation.primary_action_ar;
      safetyLabels[a.recommendation.safety.level] = a.recommendation.safety.title_ar; } });
  const defs = [
    ["category", "التصنيف", all.map(r => L.categoryOf(r, state.mode))],
    ["status", "الحالة", all.map(r => String(assessmentOf(r).status)), statusLabels],
    ["group", state.mode === "A" ? "مجموعة العينة" : "نوع السيناريو", all.map(r => L.groupOf(r, state.mode))],
  ];
  if (state.mode === "A") {
    defs.push(["safety", "السلامة", all.map(r => assessmentOf(r).recommendation.safety.level), safetyLabels]);
    defs.push(["action", "الإجراء المقترح", all.map(r => assessmentOf(r).recommendation.primary_action), actionLabels]);
  }
  for (const [key, label, values, labels] of defs) {
    const sel = el("select", { "aria-label": label, "data-filter": key,
      onchange: e => { state.filters[key] = e.target.value; refresh({ filters: false }); } }, ...options(values, labels));
    sel.value = state.filters[key];
    box.append(el("div", {}, el("label", {}, label), sel));
  }
}

function renderList(items) {
  const list = document.getElementById("list");
  document.getElementById("count").textContent = `${items.length} من ${records().length}`;
  const current = records().find(x => idOf(x) === state.selected);
  document.getElementById("pickerToggle").textContent = current
    ? `الشكوى المعروضة: ${idOf(current)} — تغيير (${items.length} نتيجة)` : `اختيار شكوى (${items.length} نتيجة)`;
  list.replaceChildren(...items.map(r => {
    const a = assessmentOf(r);
    const rec = a.recommendation;
    return el("button", { class: `item${idOf(r) === state.selected ? " selected" : ""}`, "data-id": idOf(r), onclick: () => select(idOf(r)) },
      el("div", { class: "row1" }, el("span", { class: "id mono" }, idOf(r)), statusChip(a.status, a.status_ar)),
      el("div", { class: "row1" },
        el("span", { class: "note" }, state.mode === "A" ? [`${r.category_ar} · ${r.zone_reported} · `, ltr(r.created_local)] : r.request_id),
        rec && rec.safety.level !== "NONE" ? el("span", { class: `chip small sf-${rec.safety.level}` }, rec.safety.title_ar) : null),
      el("div", { class: "txt" }, state.mode === "A" ? r.text : r.purpose));
  }));
  if (!items.length) list.append(el("div", { class: "empty" }, "مفيش نتايج بالفلاتر دي."));
}

function setPicker(open) {
  const side = document.getElementById("sidebar");
  side.classList.toggle("collapsed", !open);
  document.getElementById("pickerToggle").setAttribute("aria-expanded", String(open));
}
function select(id) {
  state.selected = id; state.interp = 0; state.tab = defaultTab();
  renderList(visible()); renderMain();
  if (isNarrow()) { setPicker(false); document.getElementById("main").scrollIntoView({ behavior: "smooth", block: "start" }); }
}
// Open the first evidence group that has items, in order of decisiveness.
function defaultTab() {
  const r = records().find(x => idOf(x) === state.selected);
  const i = r && assessmentOf(r).interpretations[state.interp];
  if (!i || !i.valid) return "contextual";
  return ["supporting", "contradicting", "contextual"].find(k => i.groups[k].length) || (i.missing.length ? "missing" : "excluded");
}

// ------------------------------------------------------------------ executive summary
function summaryCard(r, a) {
  const rec = a.recommendation;
  const tiles = [
    el("div", { class: "tile" }, el("div", { class: "label" }, "التحقق"), statusChip(a.status, a.status_ar),
      el("div", { class: "note", style: "margin-top:4px" }, a.status_text_ar)),
  ];
  if (rec) {
    tiles.push(el("div", { class: "tile" }, el("div", { class: "label" }, "مراجعة السلامة (منفصلة عن التحقق)"),
      el("span", { class: `chip sf-${rec.safety.level}` }, rec.safety.title_ar), el("div", { class: "note", style: "margin-top:4px" }, rec.safety.text_ar)));
    tiles.push(el("div", { class: "tile" }, el("div", { class: "label" }, "الإجراء المقترح — اقتراح مش تفويض"),
      el("div", { class: "big" }, rec.primary_action_ar),
      rec.records_to_review.length ? el("div", { class: "note" }, "مراجعة: ", el("span", { class: "mono" }, rec.records_to_review.join(", "))) : null));
  } else {
    tiles.push(el("div", { class: "tile" }, el("div", { class: "label" }, "المتوقع مسبقًا (pre-registered)"),
      statusChip(r.expected_status, r.expected_status ? r.expected_status : "مفيش حالة"), el("div", { class: "note" }, "النتيجة مطابقة للمتوقع.")));
    tiles.push(el("div", { class: "tile" }, el("div", { class: "label" }, "الإجراء والسلامة"), el("div", { class: "note" }, DATA.mode_b.recommendation_note_ar)));
  }
  tiles.push(el("div", { class: "tile" }, el("div", { class: "label" }, "أهم القيود"),
    (a.key_limitations_ar || []).length ? el("ul", { class: "plain note" }, ...a.key_limitations_ar.map(t => el("li", {}, t))) : el("div", { class: "note" }, "—")));
  return el("section", { class: "card", id: "summary" },
    el("h2", {}, "الخلاصة", el("span", { class: "chip small neutral mono" }, idOf(r)),
      state.mode === "A" ? el("span", { class: "note" }, ["التقييم عند: ", ltr(a.as_of_local), " (القاهرة)"]) : null),
    el("div", { class: "summary-grid" }, ...tiles));
}

// ------------------------------------------------------------------ detail panels
function complaintCard(r) {
  if (state.mode === "B") {
    return el("section", { class: "card" },

  card.append(el("div", { class: "timeline-wrap" }, svg));
  card.append(el("div", { class: "legend" },
    el("span", {}, el("i", { style: "background:#1f3a5f" }), "تقديم الشكوى"),
    el("span", {}, el("i", { style: "background:#111827" }), "وقت التقييم (as_of)"),
    el("span", {}, el("i", { style: "background:#c98a1a;border-radius:50%;width:8px" }), "وقت الملاحظة"),
    el("span", {}, el("i", { style: "background:#dbe5f1;border:1px solid #9fb0c8" }), "وقت إتاحة مسجّل"),
    el("span", {}, el("i", { style: "background:repeating-linear-gradient(45deg,#fdf3e1 0 3px,#c98a1a 3px 5px)" }), "إتاحة مُعاد بناؤها من الـreplay (مش مؤكدة تشغيليًا)"),
    el("span", {}, el("i", { style: "background:#fff;border:1px dashed #8a5a00" }), "إتاحة مفترضة (synthetic)"),
    el("span", {}, el("i", { style: "background:#fff;border:1px dashed #b42318" }), "إتاحة غير مؤكدة وقت التقييم"),
    el("span", {}, el("i", { style: "background:#e5e7eb" }), "باهت = لاحق أو غير محسوب")));
  if (state.mode === "A") card.append(el("div", { class: "note", style: "margin-top:6px" },
    "أوقات إنذارات EWS مُعاد بناؤها من الـreplay التاريخي (available_at = observed_at في كل snapshot) + هامش 30 دقيقة افتراضي؛ مش وقت إتاحة تشغيلي حقيقي."));
  return card;
}

function humanVerificationCard() {
  return el("details", { class: "card", id: "humanVerification" },
    el("summary", {}, el("h2", {}, "التحقق البشري (Human Verification)", el("span", { class: "preview-tag" }, "معاينة فقط — غير متاح في النموذج"))),
    el("div", { class: "warn" }, "الجزء ده بيعرض شكل التسجيل المخطط له بس. مفيش حفظ ولا إرسال، ومفيش أي نتيجة معاينة متسجلة في النظام."),
    el("fieldset", { class: "preview", disabled: true },
      el("label", {}, "نتيجة المعاينة"), el("select", { disabled: true },
        ...["الحالة اتشافت", "الحالة مش موجودة وقت المعاينة", "آثار حدوث حديث", "اتصلحت قبل المعاينة (بسجل)", "ما قدرناش نوصل", "غير حاسمة"].map(t => el("option", {}, t))),
      el("label", {}, "طريقة المعاينة"), el("select", { disabled: true }, ...["زيارة ميدانية", "مراجعة telemetry عن بُعد", "مراجعة كاميرا", "متابعة مع المواطن"].map(t => el("option", {}, t))),
      el("label", {}, "وقت المعاينة الفعلي / المسؤول / مرجع الدليل"), el("input", { disabled: true, placeholder: "غير متاح في النموذج الأولي" }),
      el("label", {}, "القيود وعدم اليقين"), el("textarea", { disabled: true, rows: 2, placeholder: "غير متاح في النموذج الأولي" })),
    el("div", { class: "note", style: "margin-top:6px" }, "جودة كل سجل هتتقيّم لاحقًا (L0–L3)، والإغلاق الإداري عمره ما هيتحسب تحقق."));
}

function renderMain() {
  const main = document.getElementById("main");
  const r = records().find(x => idOf(x) === state.selected);
  if (!r) {
    main.replaceChildren(el("section", { class: "card", id: "noSelection" },
      el("h2", {}, "مفيش شكوى مطابقة"),
      el("p", {}, "البحث أو الفلاتر الحالية ما بتطابقش أي سجل، فمفيش تفاصيل معروضة."),
      el("button", { class: "linkbtn", onclick: clearAll }, "مسح البحث والفلاتر")));
    return;
  }
  const a = assessmentOf(r);
  main.replaceChildren(
    summaryCard(r, a),
    complaintCard(r),
    el("div", { class: "grid2" }, assessmentCard(r, a), recommendationCard(r, a)),
    evidenceCard(a),
    timelineCard(r, a),
    humanVerificationCard(),
    el("div", { class: "note" }, ...(DATA.guardrails_ar || []).map(g => el("div", {}, "• " + g))),
  );
}

function clearAll() {
  state.search = ""; state.filters = L.emptyFilters();
  document.getElementById("search").value = "";
  refresh();
}

function setMode(mode) {
  Object.assign(state, L.stateForMode(DATA, mode));
  document.getElementById("search").value = "";
  document.getElementById("modeA").classList.toggle("active", mode === "A");
  document.getElementById("modeB").classList.toggle("active", mode === "B");
  const banner = document.getElementById("banner");
  banner.className = `banner ${mode === "A" ? "mode-a" : "mode-b"}`;
  banner.textContent = mode === "A" ? `${DATA.mode_a.banner} · ${DATA.mode_a.label}` : `${DATA.mode_b.banner} · ${DATA.mode_b.label}`;
  document.getElementById("timeSeg").style.display = mode === "A" ? "flex" : "none";
  state.tab = defaultTab();
  refresh();
}

function init() {
  if (!DATA || !L) {
    document.getElementById("layout").replaceChildren(el("div", { class: "error" },
      el("h2", {}, "بيانات العرض مش موجودة"),
      el("p", {}, "شغّل الأمر ده من فولدر المشروع وبعدين افتح الصفحة تاني:"),
      el("pre", { class: "mono" }, "python -B -m complaint_verification.dashboard.build_presentation")));
    return;
  }
  document.getElementById("modeA").addEventListener("click", () => setMode("A"));
  document.getElementById("modeB").addEventListener("click", () => setMode("B"));
  document.getElementById("search").addEventListener("input", e => { state.search = e.target.value; refresh({ filters: false }); });
  document.getElementById("clearFilters").addEventListener("click", clearAll);
  document.getElementById("pickerToggle").addEventListener("click", () =>
    setPicker(document.getElementById("sidebar").classList.contains("collapsed")));
  document.querySelectorAll("#timeSeg button").forEach(b => b.addEventListener("click", () => {
    state.time = b.dataset.time;
    document.querySelectorAll("#timeSeg button").forEach(x => x.classList.toggle("active", x === b));
    refresh();
  }));
  setMode("A");
}
init();
</script>
</body>
</html>
